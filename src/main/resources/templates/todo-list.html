<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h3 th:text="|#{todo.list.owner} [${ownerName}]|"></h3>

<div style="margin-bottom: 10px;">
    <a th:href="@{/(lang='vi')}" th:text="#{lang.vi}">Tiếng Việt</a> |
    <a th:href="@{/(lang='en')}" th:text="#{lang.en}">English</a>
</div>

<a th:href="@{/add}" th:text="#{todo.list.add}">Thêm</a>

<table border="1" cellspacing="0" cellpadding="10" style="margin-top: 10px;">
    <thead>
    <tr>
        <th th:text="#{todo.table.id}">ID</th>
        <th th:text="#{todo.table.content}">Nội dung</th>
        <th th:text="#{todo.table.dueDate}">Ngày hết hạn</th>
        <th th:text="#{todo.table.status}">Trạng thái</th>
        <th th:text="#{todo.table.priority}">Ưu tiên</th>
        <th th:text="#{todo.table.action}">Hành động</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="todo : ${todos}">
        <td th:text="${todo.id}"></td>
        <td th:text="${todo.content}"></td>
        <td th:text="${todo.dueDate}"></td>
        <td th:text="${todo.status}"></td>
        <td th:text="${todo.priority}"></td>
        <td>
            <a th:href="@{/edit/{id}(id=${todo.id})}" th:text="#{todo.action.edit}">Sửa</a> |
            <a th:href="@{/delete/{id}(id=${todo.id})}"
               th:onclick="return confirm(#{todo.action.confirm})"
               th:text="#{todo.action.delete}">
                Xóa
            </a>
        </td>
    </tr>
    </tbody>
</table>

<p th:if="${message}" th:text="${message}" style="color: green; font-weight: bold;"></p>

</body>
</html>
