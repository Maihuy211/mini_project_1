<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<a th:href="@{/add}">Thêm</a>
<table border="1" cellspacing="0" cellpadding="10">
    <thead>
    <tr>
        <th>ID</th>
        <th>Nội dung</th>
        <th>Ngày hết hạn</th>
        <th>Trạng thái</th>
        <th>Ưu tiên</th>
        <th>Hành động</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="todo : ${todos}">
        <td th:text="${todo.id}"></td>
        <td th:text="${todo.content}"></td>
        <td th:text="${todo.dueDate}"></td>
        <td th:text="${todo.status}"></td>
        <td th:text="${todo.priority}"></td>
        <td>
            <a th:href="@{/edit/{id}(id=${todo.id})}">Sửa</a>
            <a th:href="@{/delete/{id}(id=${todo.id})}"
               onclick="return confirm('Bạn có chắc muốn xóa?')">
                Xóa
            </a>
        </td>
    </tr>
    </tbody>

</table>
<p th:if="${message}" th:text="${message}" style="color: green;"></p>

</body>
</html>
