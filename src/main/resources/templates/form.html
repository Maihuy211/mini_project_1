<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<form th:action="@{/save}" th:object="${todo}" method="post">
    <input type="hidden" th:field="*{id}">
    <div>
        <label>Content:</label><br>
        <input type="text" th:field="*{content}">
        <br>
        <span style="color: red;" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></span>
    </div>
    <br>
    <div>
        <label>Due Date:</label><br>
        <input type="date" th:field="*{dueDate}">
        <br>
        <span style="color: red;" th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}"></span>
    </div>

    <br>

    <div>
        <label>Priority:</label><br>
        <select th:field="*{priority}">
            <option value="">-- Select Priority --</option>
            <option th:value="LOW">LOW</option>
            <option th:value="MEDIUM">MEDIUM</option>
            <option th:value="HIGH">HIGH</option>
        </select>
        <br>
        <span style="color: red;" th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}"></span>
    </div>
    <br>
    <div>
        <label>Status:</label><br>
        <select th:field="*{status}">
            <option value="">-- Select Status --</option>
            <option th:value="PENDING">PENDING</option>
            <option th:value="IN_PROGRESS">IN_PROGRESS</option>
            <option th:value="DONE">DONE</option>
        </select>
        <br>
        <span style="color: red;" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></span>
    </div>
    <br>
    <button type="submit" th:text="${todo.id != null ? 'Update' : 'Submit'}">
        Submit
    </button>
</form>
<br>
<a th:href="@{/}">Thoát</a>

</body>
</html>
